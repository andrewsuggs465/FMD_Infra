# Prometheus config
# https://prometheus.io/docs/prometheus/latest/configuration/configuration/

global:
  scrape_interval: 5s

scrape_configs:

  - job_name: 'foxtrot-node-exporter'
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'fmd-server-beta-exporter'
    static_configs:
      - targets: ['localhost:9101']

  - job_name: 'fmd-server-prod-exporter'
    static_configs:
      - targets: ['localhost:9102']
