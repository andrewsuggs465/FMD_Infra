# https://docs.nginx.com/nginx/admin-guide/web-server/serving-static-content/

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name packages.fmd-foss.org;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/packages.fmd-foss.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/packages.fmd-foss.org/privkey.pem;

    # No TLS 1.2 for now. We can safely do this since "packages.fmd-foss.org" is a new service. Let's see if anyone complains :)
    ssl_protocols TLSv1.3;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Xss-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' ; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), microphone=()" always;
    add_header Referrer-Policy same-origin always;

    root /packages/;

    location / {
        autoindex   on;
        sendfile    on;
        tcp_nopush  on;
        tcp_nodelay on;
    }
}
