---

- name: Set up packages.fmd-foss.org
  hosts:
    - packages
  become: true
  become_user: root

  vars:
    certbot_domains:
      - packages.fmd-foss.org

  tasks:

    - name: Create base directories
      ansible.builtin.file:
        path: "{{ item }}"
        owner: root
        group: maintainer
        mode: "u=rwx,g=rwx,o=rx"
        state: directory
      loop:
        - "/packages"
        - "/packages/server"
        # TODO: F-Droid repo
        # - "/packages/android"

    #
    # certbot
    #

    - name: Check if cert is already present
      ansible.builtin.stat:
        path: "/etc/letsencrypt/renewal/{{ certbot_domains[0] }}.conf"
      register: renewal_conf

    - name: Request initial certificate
      ansible.builtin.shell:
        cmd: "certbot certonly --non-interactive --agree-tos --webroot /var/www/acme/ -d {{ certbot_domains | join(' -d ') }} "
      notify: Reload nginx
      when: not renewal_conf.stat.exists

    #
    # main conf
    #

    - name: Copy nginx conf to sites-available
      ansible.builtin.copy:
        src: "files/nginx/packages.conf"
        dest: "/etc/nginx/sites-available/packages.conf"
        owner: root
        group: root
        mode: "u=rw,g=rw,o=r"
      notify: Reload nginx

    - name: Symlink nginx conf to sites-enabled
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/packages.conf"
        dest: "/etc/nginx/sites-enabled/packages.conf"
        state: link
      notify: Reload nginx


  handlers:
    - name: Reload nginx
      ansible.builtin.systemd_service:
        name: nginx
        enabled: true
        state: reloaded
