---

#
# Basics
#

- name: Create user
  ansible.builtin.user:
    name: "fmd-server-{{ fmd_server_env }}"
    create_home: false
    shell: /sbin/nologin
    system: true
    state: present

- name: Install apt dependencies
  ansible.builtin.apt:
    install_recommends: false
    state: present
    name:
      - sqlite3 # for debugging the DB
      # for unzipping the release
      - zip
      - unzip

# When fmd_server_local_zip is defined, upload the zip from the Ansible controller
# before extracting. Otherwise the zip must already be on the host at /packages/server/.
- name: Upload release zip from local machine
  ansible.builtin.copy:
    src: "{{ fmd_server_local_zip }}"
    dest: "/tmp/{{ fmd_server_zip }}"
  when: fmd_server_local_zip is defined
  notify: Restart FMD Server

- name: Extract binary
  ansible.builtin.unarchive:
    src: "{{ '/tmp/' + fmd_server_zip if fmd_server_local_zip is defined else '/packages/server/' + fmd_server_zip }}"
    dest: "/tmp/"
    remote_src: true
    include:
      - "fmd-server-amd64"
      - "fmd-server-ctl-amd64"
    owner: root
    group: root
    mode: "u=rw,g=,o="
  notify: Restart FMD Server

- name: Copy fmd-server binary in-place
  ansible.builtin.copy:
    src: "/tmp/fmd-server-amd64"
    dest: "/usr/bin/fmd-server-{{ fmd_server_env }}"
    remote_src: true
    owner: root
    group: root
    mode: "u=rwx,g=rx,o=rx"
  notify: Restart FMD Server

- name: Copy fmd-server-ctl binary in-place
  ansible.builtin.copy:
    src: "/tmp/fmd-server-ctl-amd64"
    dest: "/usr/bin/fmd-server-ctl-{{ fmd_server_env }}"
    remote_src: true
    owner: root
    group: maintainer
    mode: "u=rwx,g=rx,o="

# TODO: "/tmp/fmd-server" is not (re)moved.

- name: Create config directory
  ansible.builtin.file:
    path: "/etc/fmd-server-{{ fmd_server_env }}"
    owner: root
    group: root
    mode: "u=rwx,g=rwx,o=rx"
    state: directory

- name: Set up config
  ansible.builtin.template:
    src: "./roles/fmd-server/templates/fmd-server.yml"
    dest: "/etc/fmd-server-{{ fmd_server_env }}/config.yml"
    owner: root
    group: root
    mode: "u=rw,g=rw,o=r"
  notify: Restart FMD Server

- name: Set up database directory
  ansible.builtin.file:
    path: "/var/lib/fmd-server-{{ fmd_server_env }}/db"
    owner: "fmd-server-{{ fmd_server_env }}"
    group: "fmd-server-{{ fmd_server_env }}"
    mode: "u=rwx,g=rwx,o="
    state: directory

#
# systemd
#

- name: Copy systemd unit file
  ansible.builtin.template:
    src: "./roles/fmd-server/templates/fmd-server.service"
    dest: "/etc/systemd/system/fmd-server-{{ fmd_server_env }}.service"
    owner: root
    group: root
    mode: "u=rw,g=r,o=r"
  notify: Restart FMD Server

- name: Start and enable systemd service
  ansible.builtin.systemd_service:
    name: "fmd-server-{{ fmd_server_env }}.service"
    state: started
    daemon_reload: true
    enabled: true

#
# certbot (standalone mode)
#
# nginx cannot reload a config that references cert files that don't exist yet,
# so webroot is a chicken-and-egg problem on first run. Standalone mode lets
# certbot bind to port 80 itself: stop nginx → get cert → start nginx.
# Renewals use the same approach via pre/post hooks.
#

- name: Check if cert is already present
  ansible.builtin.stat:
    path: "/etc/letsencrypt/renewal/{{ fmd_server_domain }}.conf"
  register: renewal_conf

- name: Stop nginx for initial certificate request
  ansible.builtin.systemd_service:
    name: nginx
    state: stopped
  when: not renewal_conf.stat.exists

- name: Request initial certificate (standalone)
  ansible.builtin.shell:
    cmd: >-
      certbot certonly --standalone --non-interactive --agree-tos
      {{ '--email ' + fmd_server_certbot_email if fmd_server_certbot_email is defined else '--register-unsafely-without-email' }}
      -d {{ fmd_server_domain }}
  when: not renewal_conf.stat.exists

- name: Start nginx after initial certificate
  ansible.builtin.systemd_service:
    name: nginx
    state: started
  when: not renewal_conf.stat.exists

- name: Install renewal pre-hook to stop nginx before standalone renewal
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/pre/nginx-stop.sh
    content: "#!/bin/sh\nsystemctl stop nginx\n"
    owner: root
    group: root
    mode: "0755"

- name: Install renewal post-hook to start nginx after standalone renewal
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/post/nginx-start.sh
    content: "#!/bin/sh\nsystemctl start nginx\n"
    owner: root
    group: root
    mode: "0755"

#
# nginx
#

- name: Copy nginx conf to sites-available
  ansible.builtin.template:
    src: "./roles/fmd-server/templates/nginx.conf"
    dest: "/etc/nginx/sites-available/fmd-server-{{ fmd_server_env }}.conf"
    owner: root
    group: root
    mode: "u=rw,g=rw,o=r"
  notify: Reload nginx

- name: Symlink nginx conf to sites-enabled
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/fmd-server-{{ fmd_server_env }}.conf"
    dest: "/etc/nginx/sites-enabled/fmd-server-{{ fmd_server_env }}.conf"
    state: link
  notify: Reload nginx

#
# fail2ban
# This is intentionally a shared jail for all FMD Servers on this host.
# https://gitlab.com/fmd-foss/fmd-server/-/blob/v0.12.0/docs/fail2ban.md
#

- name: Copy fail2ban filter
  ansible.builtin.copy:
    src: "./roles/fmd-server/templates/fail2ban-filter.conf"
    dest: "/etc/fail2ban/filter.d/fmd-server.local"
    owner: root
    group: root
    mode: "u=rw,g=r,o=r"
  notify: Restart fail2ban

- name: Copy fail2ban jail
  ansible.builtin.copy:
    src: "./roles/fmd-server/templates/fail2ban-jail.conf"
    dest: "/etc/fail2ban/jail.d/fmd-server.local"
    owner: root
    group: root
    mode: "u=rw,g=r,o=r"
  notify: Restart fail2ban

